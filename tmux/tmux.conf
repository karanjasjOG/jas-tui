# --- Core behavior ---
set -g mouse on

# Prefix change (Ctrl-a instead of Ctrl-b)
#unbind C-b
#set -g prefix C-Space
#bind C-Space send-prefix

# Start indexing from 1 (more natural)
set -g base-index 1
setw -g pane-base-index 1

# Faster key response
set -s escape-time 0

# More scrollback
set -g history-limit 10000

# --- Vi Mode for Copy/Scrollback ---
# This fixes the issue where hjkl didn't work in copy mode!
set-window-option -g mode-keys vi

# Sane Vim-like yanking mechanics inside copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Splits (intuitive keys) ---
bind | split-window -h
bind - split-window -v

# --- Pane navigation (prefix-based, safe) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind s choose-tree -sZ

bind-key -r f run-shell "tmux new-window ~/.local/bin/tmux-sessionizer.sh"
# --- Reload config quickly ---
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"
